<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сериалы | Онлайн Кинотеатр</title>
  <!-- Все стили из movies.html -->
  <style>
    body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .auth-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .auth-button {
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            color: white;
            background-color: #4CAF50;
        }
        .auth-button:hover {
            background-color: #45a049;
        }
        .profile-button {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
        }
        .profile-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background-color: #444;
            padding: 10px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
        }
        nav a.active {
            background-color: #4CAF50;
            padding: 10px;
            border-radius: 4px;
        }
        .search-bar {
            text-align: center;
            margin: 20px;
        }
        .search-bar input {
            padding: 10px;
            width: 300px;
        }
        .premieres, .movies {
            margin: 20px;
        }
        .premieres h2, .movies h2 {
            color: #333;
        }
        .movie-list {
            display: flex;
            flex-wrap: wrap;
        }
        .movie-item {
            background-color: #fff;
            margin: 10px;
            padding: 10px;
            width: 200px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            margin: 16px;
            width: 200px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        .card img {
            max-width: 100%;
            border-radius: 8px;
        }
        .card h3 {
            margin: 8px 0;
        }
        .card p {
            margin: 4px 0;
            color: #555;
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            padding: 20px 0;
        }
        .movie-item a {
            display: inline-block;
            margin-top: 10px;
            color: #4CAF50;
            text-decoration: none;
        }
        .pagination a, .pagination span {
            color: #333;
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid #ddd;
            margin: 0 4px;
            border-radius: 4px;
        }
        .pagination a:hover {
            background-color: #ddd;
        }
        .pagination .current {
            background-color: #4CAF50;
            color: white;
            border: 1px solid #4CAF50;
        }
        .pagination-info {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
        }
  </style>
</head>
<body>
<!-- Тот же header, nav и search-bar как в movies.html -->
<header>
  <h1>ONLINE CINEMA</h1>
  <div class="auth-buttons">
    <div th:unless="${#authorization.expression('isAuthenticated()')}">
      <a href="/login" class="auth-button">Войти</a>
      <a href="/register" class="auth-button">Регистрация</a>
    </div>
    <div th:if="${#authorization.expression('isAuthenticated()')}">
      <a href="/profile" class="profile-button">
        <img th:src="@{/images/main.png}"
             alt="Аватар" class="profile-avatar">
        <span th:text="${#authentication.principal.username}"></span>
      </a>
    </div>
  </div>
</header>
<nav>
  <a href="/movies">ФИЛЬМЫ</a>
  <a href="/series" class="active">СЕРИАЛЫ</a>
  <a href="/movies/cartoon">МУЛЬТФИЛЬМЫ</a>
</nav>
<div class="search-bar">
  <form action="/search" method="get">
    <input type="text" name="query" placeholder="Введите название">
    <button type="submit">Поиск</button>
  </form>
</div>

<div class="content">
  <h2>СЕРИАЛЫ</h2>

  <div class="pagination-info" th:if="${totalPages > 1}">
    Страница <span th:text="${currentPage}"></span> из <span th:text="${totalPages}"></span>
    | Всего сериалов: <span th:text="${totalItems}"></span>
  </div>

  <div class="movie-list">
    <div class="movie-item" th:each="series : ${items}">
      <h3 th:text="${series.title}"></h3>
      <p>Рейтинг: <span th:text="${series.rating}"></span></p>
      <a th:href="@{/series/{id}(id=${series.seriesId})}">Подробнее</a>
    </div>
  </div>

  <div class="pagination" th:if="${totalPages > 1}">
    <a th:if="${currentPage > 1}" th:href="@{/series(page=${currentPage - 1})}">Назад</a>

    <span th:each="i : ${#numbers.sequence(1, totalPages)}">
            <a th:if="${i != currentPage}" th:href="@{/series(page=${i})}" th:text="${i}"></a>
            <span th:unless="${i != currentPage}" class="current" th:text="${i}"></span>
        </span>

    <a th:if="${currentPage < totalPages}" th:href="@{/series(page=${currentPage + 1})}">Вперед</a>
  </div>
</div>

</body>
</html>
