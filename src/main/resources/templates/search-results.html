<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Результаты поиска | Онлайн Кинотеатр</title>
  <!-- Все стили из movies.html -->
  <style>
    body {
           font-family: Arial, sans-serif;
           margin: 0;
           padding: 0;
           background-color: #f4f4f4;
       }
       header {
           background-color: #333;
           color: #fff;
           padding: 10px 20px;
           display: flex;
           justify-content: space-between;
           align-items: center;
       }
       .auth-buttons {
           display: flex;
           gap: 10px;
           align-items: center;
       }
       .auth-button {
           padding: 8px 16px;
           border-radius: 4px;
           text-decoration: none;
           color: white;
           background-color: #4CAF50;
       }
       .auth-button:hover {
           background-color: #45a049;
       }
       .profile-button {
           display: flex;
           align-items: center;
           gap: 8px;
           color: white;
           text-decoration: none;
       }
       .profile-avatar {
           width: 32px;
           height: 32px;
           border-radius: 50%;
           object-fit: cover;
       }
       nav {
           display: flex;
           justify-content: space-around;
           background-color: #444;
           padding: 10px;
       }
       nav a {
           color: #fff;
           text-decoration: none;
       }
       nav a.active {
           background-color: #4CAF50;
           padding: 10px;
           border-radius: 4px;
       }
       .search-bar {
           text-align: center;
           margin: 20px;
       }
       .search-bar input {
           padding: 10px;
           width: 300px;
       }
       .premieres, .movies {
           margin: 20px;
       }
       .premieres h2, .movies h2 {
           color: #333;
       }
       .movie-list {
           display: flex;
           flex-wrap: wrap;
       }
       .movie-item {
           background-color: #fff;
           margin: 10px;
           padding: 10px;
           width: 200px;
           box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
       }
       .card {
           border: 1px solid #ccc;
           border-radius: 8px;
           padding: 16px;
           margin: 16px;
           width: 200px;
           box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
           display: inline-block;
       }
       .card img {
           max-width: 100%;
           border-radius: 8px;
       }
       .card h3 {
           margin: 8px 0;
       }
       .card p {
           margin: 4px 0;
           color: #555;
       }
       .pagination {
           display: flex;
           justify-content: center;
           margin: 20px 0;
           padding: 20px 0;
       }
       .movie-item a {
           display: inline-block;
           margin-top: 10px;
           color: #4CAF50;
           text-decoration: none;
       }
       .pagination a, .pagination span {
           color: #333;
           padding: 8px 16px;
           text-decoration: none;
           border: 1px solid #ddd;
           margin: 0 4px;
           border-radius: 4px;
       }
       .pagination a:hover {
           background-color: #ddd;
       }
       .pagination .current {
           background-color: #4CAF50;
           color: white;
           border: 1px solid #4CAF50;
       }
       .pagination-info {
           text-align: center;
           margin-bottom: 20px;
           color: #666;
       }
  </style>
</head>
<body>
<!-- Тот же header и nav как в movies.html -->
<header>
  <h1>ONLINE CINEMA</h1>
  <div class="auth-buttons">
    <div th:unless="${#authorization.expression('isAuthenticated()')}">
      <a href="/login" class="auth-button">Войти</a>
      <a href="/register" class="auth-button">Регистрация</a>
    </div>
    <div th:if="${#authorization.expression('isAuthenticated()')}">
      <a href="/profile" class="profile-button">
        <img th:src="@{/images/main.png}"
             alt="Аватар" class="profile-avatar">
        <span th:text="${#authentication.principal.username}"></span>
      </a>
    </div>
  </div>
</header>
<nav>
  <a href="/movies">ФИЛЬМЫ</a>
  <a href="/series">СЕРИАЛЫ</a>
  <a href="/movies/cartoon">МУЛЬТФИЛЬМЫ</a>
</nav>

<div class="search-bar">
  <form action="/search" method="get">
    <input type="text" name="query" th:value="${query}" placeholder="Введите название">
    <button type="submit">Поиск</button>
  </form>
</div>

<div class="content">
  <h2>Результаты поиска: "<span th:text="${query}"></span>"</h2>

  <!-- Фильмы -->
  <div class="search-section" th:if="${not movies.empty}">
    <h3>Фильмы</h3>
    <div class="movie-list">
      <div class="movie-item" th:each="movie : ${movies}">
        <h4 th:text="${movie.title}"></h4>
        <p>Рейтинг: <span th:text="${movie.rating}"></span></p>
        <a th:href="@{/movies/{id}(id=${movie.movieId})}">Подробнее</a>
      </div>
    </div>
    <div class="pagination" th:if="${totalMoviesPages > 1}">
      <a th:if="${currentPage > 1}" th:href="@{/search(query=${query}, page=${currentPage - 1})}">Назад</a>
      <span th:text="${currentPage} + ' из ' + ${totalMoviesPages}"></span>
      <a th:if="${currentPage < totalMoviesPages}" th:href="@{/search(query=${query}, page=${currentPage + 1})}">Вперед</a>
    </div>
  </div>

  <!-- Мультфильмы -->
  <div class="search-section" th:if="${not cartoons.empty}">
    <h3>Мультфильмы</h3>
    <div class="movie-list">
      <div class="movie-item" th:each="cartoon : ${cartoons}">
        <h4 th:text="${cartoon.title}"></h4>
        <p>Рейтинг: <span th:text="${cartoon.rating}"></span></p>
        <a th:href="@{/movies/cartoon/{id}(id=${cartoon.movieId})}">Подробнее</a>
      </div>
    </div>
  </div>

  <!-- Сериалы -->
  <div class="search-section" th:if="${not series.empty}">
    <h3>Сериалы</h3>
    <div class="movie-list">
      <div class="movie-item" th:each="s : ${series}">
        <h4 th:text="${s.title}"></h4>
        <p>Рейтинг: <span th:text="${s.rating}"></span></p>
        <a th:href="@{/series/{id}(id=${s.seriesId})}">Подробнее</a>
      </div>
    </div>
  </div>

  <div class="no-results" th:if="${movies.empty and cartoons.empty and series.empty}">
    По запросу "<span th:text="${query}"></span>" ничего не найдено
  </div>
</div>

</body>
</html>
