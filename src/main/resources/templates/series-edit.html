<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Редактировать сериал</title>
  <!-- Используем те же стили -->
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    header {
      background-color: #333;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .auth-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .auth-button {
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      color: white;
      background-color: #4CAF50;
    }
    .auth-button:hover {
      background-color: #45a049;
    }
    .profile-button {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      text-decoration: none;
    }
    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .form-container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="url"],
    .form-group textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .form-group textarea {
      min-height: 100px;
    }
    .has-error input,
    .has-error textarea {
      border-color: #ff0000;
    }
    .error-message {
      color: #ff0000;
      font-size: 0.8em;
    }
    .btn-submit {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-submit:hover {
      background-color: #45a049;
    }
    .btn-cancel {
      padding: 10px 15px;
      color: #333;
      text-decoration: none;
      margin-left: 10px;
    }
    .alert-danger {
      color: #721c24;
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
<header>
  <h1>ONLINE CINEMA</h1>
  <div class="auth-buttons">
    <div th:unless="${#authorization.expression('isAuthenticated()')}">
      <a href="/login" class="auth-button">Войти</a>
      <a href="/register" class="auth-button">Регистрация</a>
    </div>
    <div th:if="${#authorization.expression('isAuthenticated()')}">
      <a href="/profile" class="profile-button">
        <img th:src="@{/images/main.png}" alt="Аватар" class="profile-avatar">
        <span th:text="${#authentication.principal.username}"></span>
      </a>
    </div>
  </div>
</header>

<div class="form-container">
  <h2>Редактировать сериал</h2>

  <div th:if="${errors != null}" class="alert alert-danger">
    <ul>
      <li th:each="err : ${errors}" th:text="${err.defaultMessage}"></li>
    </ul>
  </div>

  <form th:action="@{/series/edit/{id}(id=${series.id})}" method="post" th:object="${series}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <!-- Название -->
    <div class="form-group" th:classappend="${#fields.hasErrors('title')} ? 'has-error' : ''">
      <label for="title">Название сериала</label>
      <input type="text" id="title" th:field="*{title}" required>
      <span class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
    </div>

    <!-- Описание -->
    <div class="form-group" th:classappend="${#fields.hasErrors('description')} ? 'has-error' : ''">
      <label for="description">Описание</label>
      <textarea id="description" th:field="*{description}"></textarea>
      <span class="error-message" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
    </div>

    <!-- Жанр -->
    <div class="form-group" th:classappend="${#fields.hasErrors('genre')} ? 'has-error' : ''">
      <label for="genre">Жанр</label>
      <input type="text" id="genre" th:field="*{genre}" required>
      <span class="error-message" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></span>
    </div>

    <!-- Год выпуска -->
    <div class="form-group" th:classappend="${#fields.hasErrors('year')} ? 'has-error' : ''">
      <label for="year">Год выпуска</label>
      <input type="number" id="year" th:field="*{year}" min="1888" max="2100" required>
      <span class="error-message" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></span>
    </div>

    <!-- Рейтинг -->
    <div class="form-group" th:classappend="${#fields.hasErrors('rating')} ? 'has-error' : ''">
      <label for="rating">Рейтинг (0-10)</label>
      <input type="number" id="rating" th:field="*{rating}" step="0.1" min="0" max="10" required>
      <span class="error-message" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></span>
    </div>

    <!-- URL постера -->
    <div class="form-group" th:classappend="${#fields.hasErrors('posterUrl')} ? 'has-error' : ''">
      <label for="posterUrl">URL постера</label>
      <input type="url" id="posterUrl" th:field="*{posterUrl}" required>
      <span class="error-message" th:if="${#fields.hasErrors('posterUrl')}" th:errors="*{posterUrl}"></span>
    </div>

    <!-- Поле: URL видео -->
    <div class="form-group" th:classappend="${#fields.hasErrors('movieUrl')} ? 'has-error' : ''">
      <label for="movieUrl">URL видео</label>
      <input type="url" id="movieUrl" th:field="*{movieUrl}" required>
      <span class="error-message" th:if="${#fields.hasErrors('movieUrl')}" th:errors="*{movieUrl}"></span>
    </div>


    <div class="form-group">
      <button type="submit" class="btn-submit">Сохранить изменения</button>
      <a th:href="@{/series/{id}(id=${series.id})}" class="btn-cancel">Отмена</a>
    </div>
  </form>
</div>
</body>
</html>
