<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн Кинотеатр</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background-color: #444;
            padding: 10px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
        }
        nav a.active {
            background-color: #4CAF50;
            padding: 10px;
            border-radius: 4px;
        }
        .search-bar {
            text-align: center;
            margin: 20px;
        }
        .search-bar input {
            padding: 10px;
            width: 300px;
        }
        .premieres, .movies {
            margin: 20px;
        }
        .premieres h2, .movies h2 {
            color: #333;
        }
        .movie-list {
            display: flex;
            flex-wrap: wrap;
        }
        .movie-item {
            background-color: #fff;
            margin: 10px;
            padding: 10px;
            width: 200px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            margin: 16px;
            width: 200px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        .card img {
            max-width: 100%;
            border-radius: 8px;
        }
        .card h3 {
            margin: 8px 0;
        }
        .card p {
            margin: 4px 0;
            color: #555;
        }
        .pagination {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            padding: 20px 0;
        }
        .movie-item a {
            display: inline-block;
            margin-top: 10px;
            color: #4CAF50;
            text-decoration: none;
        }
        .pagination a, .pagination span {
            color: #333;
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid #ddd;
            margin: 0 4px;
            border-radius: 4px;
        }
        .pagination a:hover {
            background-color: #ddd;
        }
        .pagination .current {
            background-color: #4CAF50;
            color: white;
            border: 1px solid #4CAF50;
        }
        .pagination-info {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
        }
    </style>
</head>
<body>
<header>
    <h1>ONLINE CINEMA</h1>
</header>
<nav>
    <a th:href="@{'/?section=movies&page=1'}"
       th:classappend="${currentSection == 'movies'} ? 'active' : ''">ФИЛЬМЫ</a>
    <a th:href="@{'/?section=series&page=1'}"
       th:classappend="${currentSection == 'series'} ? 'active' : ''">СЕРИАЛЫ</a>
    <a th:href="@{'/?section=cartoons&page=1'}"
       th:classappend="${currentSection == 'cartoons'} ? 'active' : ''">МУЛЬТФИЛЬМЫ</a>
</nav>
<div class="search-bar">
    <form th:action="@{/search}" method="get">
        <input type="text" name="query" placeholder="Введите название">
        <button type="submit">Поиск</button>
    </form>
</div>

<!-- Информация о пагинации -->
<div class="pagination-info" th:if="${totalPages > 1}">
    Страница <span th:text="${currentPage}"></span> из <span th:text="${totalPages}"></span>
    | Всего элементов: <span th:text="${totalItems}"></span>
</div>

<!-- Динамическое отображение контента -->
<section class="content">
    <!-- Премьеры -->
    <div th:if="${currentSection == 'premieres'}">
        <h2>ПРЕМЬЕРЫ</h2>
        <div class="movie-list">
            <div th:each="movie : ${items}">
                <div class="movie-item">
                    <h3 th:text="${movie.title}"></h3>
                    <p th:text="${movie.rating}"></p>
                    <a th:href="@{/movies/{id}(id=${movie.movieId})}">Подробнее</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Фильмы -->
    <div th:if="${currentSection == 'movies'}">
        <h2>ФИЛЬМЫ</h2>
        <div class="movie-list">
            <div th:each="movie : ${items}">
                <div class="movie-item">
                    <h3 th:text="${movie.title}"></h3>
                    <p th:text="${movie.rating}"></p>
                    <a th:href="@{/movies/{id}(id=${movie.movieId})}">Подробнее</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Мультфильмы -->
    <div th:if="${currentSection == 'cartoons'}">
        <h2>МУЛЬТФИЛЬМЫ</h2>
        <div class="movie-list">
            <div th:each="cartoon : ${items}">
                <div class="movie-item">
                    <h3 th:text="${cartoon.title}"></h3>
                    <p th:text="${cartoon.rating}"></p>
                    <a th:href="@{movies/cartoons/{id}(id=${cartoon.movieId})}">Подробнее</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Сериалы -->
    <div th:if="${currentSection == 'series'}">
        <h2>СЕРИАЛЫ</h2>
        <div class="movie-list">
            <div th:each="series : ${items}">
                <div class="movie-item">
                    <h3 th:text="${series.title}"></h3>
                    <p th:text="${series.rating}"></p>
                    <a th:href="@{/series/{id}(id=${series.seriesId})}">Подробнее</a>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Общая пагинация -->
<div class="pagination" th:if="${totalPages > 1}">
    <!-- Кнопка "Назад" -->
    <span th:if="${currentPage > 1}">
        <a th:href="@{/(section=${currentSection},page=${currentPage - 1})}">&laquo; Назад</a>
    </span>

    <!-- Номера страниц -->
    <span th:each="i : ${#numbers.sequence(1, totalPages)}">
        <a th:if="${i != currentPage}"
           th:href="@{/(section=${currentSection},page=${i})}"
           th:text="${i}"></a>
        <span th:unless="${i != currentPage}" th:text="${i}" class="current"></span>
    </span>

    <!-- Кнопка "Вперед" -->
    <span th:if="${currentPage < totalPages}">
        <a th:href="@{/(section=${currentSection},page=${currentPage + 1})}">Вперед &raquo;</a>
    </span>
</div>

</body>
</html>
