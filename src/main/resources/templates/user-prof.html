<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль пользователя | Онлайн Кинотеатр</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
        display: flex;
        min-height: 100vh;
    }

    /* Стили для шапки (как в главной) */
    header {
        background-color: #333;
        color: #fff;
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
    }

    .auth-buttons {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .profile-button {
        display: flex;
        align-items: center;
        gap: 8px;
        color: white;
        text-decoration: none;
    }

    .profile-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
    }

    /* Боковая панель профиля */
    .profile-sidebar {
        width: 300px;
        background-color: #fff;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        position: fixed;
        top: 60px;
        bottom: 0;
        overflow-y: auto;
    }

    .profile-header {
        text-align: center;
        margin-bottom: 20px;
    }

    .profile-avatar-large {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
        border: 3px solid #4CAF50;
    }

    .profile-info {
        margin-bottom: 30px;
    }

    .profile-info h2 {
        color: #333;
        margin-bottom: 5px;
        text-align: center;
    }

    .profile-info p {
        color: #666;
        text-align: center;
        margin: 5px 0;
    }

    .settings-form {
        margin-top: 20px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #333;
    }

    .form-group input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }

    .save-btn {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
    }

    .save-btn:hover {
        background-color: #45a049;
    }

    /* Основное содержимое - библиотека фильмов */
    .profile-content {
        margin-left: 300px;
        padding: 80px 20px 20px;
        width: calc(100% - 300px);
    }

    .library-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .library-header h2 {
        color: #333;
    }

    .movie-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
    }

    .movie-card {
        background-color: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        transition: transform 0.3s;
    }

    .movie-card:hover {
        transform: translateY(-5px);
    }

    .movie-poster {
        width: 100%;
        height: 250px;
        object-fit: cover;
    }

    .movie-info {
        padding: 15px;
    }

    .movie-title {
        font-weight: bold;
        margin-bottom: 5px;
        color: #333;
    }

    .movie-meta {
        color: #666;
        font-size: 14px;
    }

    /* Адаптивность */
    @media (max-width: 768px) {
        body {
            flex-direction: column;
        }
        .profile-sidebar {
            width: 100%;
            position: static;
        }
        .profile-content {
            width: 100%;
            margin-left: 0;
        }
    }
  </style>
</head>
<body>
<header>
  <h1>ONLINE CINEMA</h1>
  <div class="auth-buttons">
    <a href="/" class="auth-button">На главную</a>
    <a href="/logout" class="auth-button">Выйти</a>
  </div>
</header>

<!-- Боковая панель профиля -->
<div class="profile-sidebar">
  <div class="profile-header">
    <img th:src="${user.avatarUrl} ?: '/images/default-avatar.png'"
         alt="Аватар" class="profile-avatar-large">
    <div class="profile-info">
      <h2 th:text="${user.username}">Имя пользователя</h2>
      <p>Участник с: <span th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy')}">01.01.2023</span></p>
      <p>Фильмов в библиотеке: <span th:text="${movies.size()}">0</span></p>
    </div>
  </div>

  <div class="settings-form">
    <h3>Настройки профиля</h3>
    <form th:action="@{/profile/update}" method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username" th:value="${user.username}">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" th:value="${user.email}">
      </div>
      <div class="form-group">
        <label for="password">Новый пароль (оставьте пустым, если не хотите менять)</label>
        <input type="password" id="password" name="password">
      </div>
      <div class="form-group">
        <label for="avatar">Аватар</label>
        <input type="file" id="avatar" name="avatar" accept="image/*">
      </div>
      <button type="submit" class="save-btn">Сохранить изменения</button>
    </form>
  </div>
</div>

<!-- Основное содержимое - библиотека фильмов -->
<div class="profile-content">
  <div class="library-header">
    <h2>Моя библиотека</h2>
    <div class="sort-options">
      <select>
        <option>Сортировать по дате добавления</option>
        <option>Сортировать по названию</option>
        <option>Сортировать по рейтингу</option>
      </select>
    </div>
  </div>

  <div class="movie-grid">
    <!-- Карточка фильма 1 -->
    <div class="movie-card" th:each="movie : ${movies}">
      <img th:src="${movie.posterUrl}" alt="Постер фильма" class="movie-poster">
      <div class="movie-info">
        <div class="movie-title" th:text="${movie.title}">Название фильма</div>
        <div class="movie-meta">
          <span th:text="${movie.genre}">Жанр</span> |
          <span th:text="${movie.year}">Год</span>
        </div>
        <div class="movie-meta" th:text="'Рейтинг: ' + ${movie.rating}">Рейтинг: 8.5</div>
      </div>
    </div>

    <!-- Сообщение если библиотека пуста -->
    <div th:if="${movies.empty}" class="empty-library">
      <p>Ваша библиотека пуста. <a href="/">Начните добавлять фильмы!</a></p>
    </div>
  </div>
</div>

</body>
</html>
